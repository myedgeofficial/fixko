<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Popravko pregled</title>
  <style>
    :root{--bg:#F4F6F5;--kartica:#fff;--tekst:#16201D;--siva:#5E6B66;--rob:rgba(0,0,0,.1);--zelena:#1F8A5B;--zelena-bg:#E3F4EB;--rumena:#9A6700;--rumena-bg:#FFF4D6;--rdeca:#B42318;--rdeca-bg:#FDE7E5;--modra:#1D5FD1}
    @media (prefers-color-scheme:dark){:root{--bg:#121816;--kartica:#1B2321;--tekst:#E7EDEA;--siva:#9AA8A2;--rob:rgba(255,255,255,.12);--zelena:#4CC38A;--zelena-bg:#173528;--rumena:#E6B54A;--rumena-bg:#3A3018;--rdeca:#F97066;--rdeca-bg:#3D1C1A;--modra:#7AA7FF}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--tekst);font:15px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif}
    .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
    h1{font-size:24px;margin:0 0 14px}
    a{color:var(--modra)}
    small,.siva{color:var(--siva)}
    input{width:100%;max-width:340px;padding:12px;font-size:16px;border-radius:10px;border:1px solid var(--rob);background:var(--kartica);color:var(--tekst);margin-bottom:10px}
    button{font:inherit;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--zelena);color:#fff;font-weight:600}
    button.ghost{background:transparent;color:var(--tekst);border:1px solid var(--rob)}
    button.rdec{background:var(--rdeca)}
    button:disabled{opacity:.5;cursor:default}
    .banka{background:var(--kartica);border:1px solid var(--rob);border-radius:14px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center}
    .filtri{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
    .filtri button{background:transparent;color:var(--tekst);border:1px solid var(--rob);font-weight:500}
    .filtri button.izbran{background:var(--tekst);color:var(--bg)}
    .filtri input{margin:0 0 0 auto;max-width:240px;padding:8px 10px;font-size:14px}
    .m{background:var(--kartica);border:1px solid var(--rob);border-radius:14px;padding:14px;margin:10px 0;display:grid;grid-template-columns:56px 1fr auto;gap:12px}
    .m img{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--rob)}
    .m .ime{font-weight:700;font-size:16px}
    .podatki{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 16px;margin-top:6px}
    .znacka{display:inline-block;padding:3px 9px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
    .z-potrjen{background:var(--zelena-bg);color:var(--zelena)}
    .z-caka{background:var(--rumena-bg);color:var(--rumena)}
    .z-zavrnjen{background:var(--rdeca-bg);color:var(--rdeca)}
    .z-ni{background:var(--rob);color:var(--siva)}
    .nakazilo{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--bg)}
    .desno{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
    .err{color:var(--rdeca);margin:8px 0}
    .stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
    .tile{background:var(--kartica);border:1px solid var(--rob);border-radius:14px;padding:12px 14px}
    .tile .st{font-size:26px;font-weight:700;line-height:1.1}
    .tile .op{font-size:13px;color:var(--siva)}
    .graf{background:var(--kartica);border:1px solid var(--rob);border-radius:14px;padding:12px 14px;margin-bottom:14px}
    .zavihki{display:flex;gap:6px;margin:4px 0 14px}
    .zavihki button{background:transparent;color:var(--tekst);border:1px solid var(--rob);font-size:16px}
    .zavihki button.izbran{background:var(--zelena);color:#fff;border-color:var(--zelena)}
    .d{background:var(--kartica);border:1px solid var(--rob);border-radius:14px;padding:12px;margin:8px 0;display:grid;grid-template-columns:24px 64px 1fr auto;gap:12px;align-items:center}
    .d img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--rob)}
    .d input{width:20px;height:20px;margin:0}
    .z-odprto{background:var(--zelena-bg);color:var(--zelena)}
    .z-prevzeto,.z-opravljeno{background:var(--rob);color:var(--tekst)}
    .z-preklicano{background:var(--rdeca-bg);color:var(--rdeca)}
    @media (max-width:640px){.d{grid-template-columns:24px 48px 1fr}.d img{width:48px;height:48px}.d .desno{grid-column:1/-1}}
    .stolpci{display:flex;align-items:flex-end;gap:2px;height:70px;margin-top:8px}
    .stolpci div{flex:1;background:var(--zelena);border-radius:3px 3px 0 0;min-height:2px}
    .stolpci div.prazen{background:var(--rob)}
    .os{display:flex;justify-content:space-between;font-size:12px;color:var(--siva);margin-top:4px}
    @media (max-width:640px){.m{grid-template-columns:44px 1fr}.m img{width:44px;height:44px}.desno{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;align-items:center}.filtri input{margin:6px 0 0;max-width:none}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Popravko · mojstri</h1>
    <div id="vsebina"><p class="siva">Nalagam …</p></div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
  <script>
    // Vsi mojstri in potrditev podjetja (nakazilo 0,01 €). Dostop: povezava v e-pošti (samo lastniški naslovi) ali koda skrbnika.
    firebase.initializeApp({ apiKey: "AIzaSyCi-g2V67UMyELMjG7fl0BxcqCuUaWRkx4", authDomain: "fixko-app.firebaseapp.com", projectId: "fixko-app", appId: "1:117276939392:web:9728005ec9450ac8c50265" });
    const klic = firebase.app().functions("europe-west1").httpsCallable("skrbnik");
    const el = document.getElementById("vsebina");
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const kdaj = (ms) => ms ? new Date(ms).toLocaleString("sl-SI", { dateStyle: "short", timeStyle: "short" }) : "–";
    const dan = (ms) => ms ? new Date(ms).toLocaleDateString("sl-SI") : "–";
    const STANJE = { potrjen: "Potrjen", caka: "Čaka na potrditev", zavrnjen: "Zavrnjen", ni: "Ni nakazal" };
    let koda = "", podatki = null, stat = null, filter = "caka", iskanje = "", pogled = "mojstri", dela = null, izbrana = new Set();
    try { koda = localStorage.getItem("skrbnik") || ""; filter = localStorage.getItem("pregled-filter") || "caka"; } catch (e) {}

    const auth = firebase.auth();
    function prijava(napaka, sKodo) {
      el.innerHTML = sKodo
        ? `<input id="koda" type="password" placeholder="Koda skrbnika" autocomplete="off">${napaka ? `<div class="err">${esc(napaka)}</div>` : ""}<div><button id="ok">Naprej</button></div>`
        : `<p>Vpiši svoj e-naslov. Poslali ti bomo povezavo za prijavo.</p>
           <input id="mail" type="email" placeholder="ime@gmail.com" autocomplete="email">${napaka ? `<div class="err">${esc(napaka)}</div>` : ""}
           <div><button id="ok">Pošlji povezavo</button></div><p><a href="#" id="zkodo" class="siva">Imam kodo skrbnika</a></p>`;
      const i = el.querySelector("input");
      const naprej = async () => {
        if (sKodo) {
          koda = i.value.trim(); try { localStorage.setItem("skrbnik", koda); } catch (e) {}
          if (!auth.currentUser) await auth.signInAnonymously();
          return nalozi();
        }
        const mail = i.value.trim().toLowerCase();
        if (!mail.includes("@")) return prijava("Vpiši e-naslov.");
        document.getElementById("ok").disabled = true;
        try {
          await auth.sendSignInLinkToEmail(mail, { url: location.origin + "/", handleCodeInApp: true });
          try { localStorage.setItem("pregled-mail", mail); } catch (e) {}
          el.innerHTML = `<p><b>Povezava je poslana na ${esc(mail)}.</b></p><p class="siva">Odpri e-pošto (poglej tudi v vsiljeno pošto) in klikni povezavo. Prijava velja na tej napravi, dokler se ne odjaviš.</p>`;
        } catch (e) { prijava(e.message); }
      };
      document.getElementById("ok").onclick = naprej;
      i.onkeydown = (e) => { if (e.key === "Enter") naprej(); };
      const z = document.getElementById("zkodo");
      if (z) z.onclick = (e) => { e.preventDefault(); prijava("", true); };
      i.focus();
    }
    async function odjava(napaka) {
      koda = ""; try { localStorage.removeItem("skrbnik"); } catch (x) {}
      await auth.signOut().catch(() => {});
      prijava(napaka);
    }
    async function nalozi() {
      klic({ koda, akcija: "statistika" }).then((r) => { stat = r.data; if (podatki) izrisi(); }).catch((e) => console.warn("statistika", e));
      try { podatki = (await klic({ koda, akcija: "vsi" })).data; }
      catch (e) {
        if (e.code === "functions/permission-denied" || e.code === "functions/unauthenticated") return odjava(auth.currentUser?.email ? `Naslov ${auth.currentUser.email} nima dostopa.` : e.message);
        el.innerHTML = `<div class="err">${esc(e.message)}</div>`; return;
      }
      izrisi();
    }
    function narocnina(m) {
      if (m.testni) return "testni račun";
      if (m.narocninaDo > Date.now()) return (m.transakcija ? "plačana" : m.preizkus ? "preizkus" : "brezplačna") + " do " + dan(m.narocninaDo);
      return m.narocninaDo ? "potekla " + dan(m.narocninaDo) : "ni aktivirana";
    }
    function banka(b) {
      if (!b.nastavljeno) return `<b>Banka:</b> <span class="znacka z-ni">ni nastavljena</span>`;
      const potekla = b.veljaDo && b.veljaDo < Date.now();
      return `<b>Banka (Enable Banking):</b>
        <span class="znacka ${b.povezano && !potekla ? "z-potrjen" : "z-zavrnjen"}">${b.povezano ? (potekla ? "povezava potekla" : "povezana") : "ni povezana"}</span>
        ${b.iban ? `<span>${esc(b.iban)}</span>` : ""}
        <span class="siva">velja do ${dan(b.veljaDo)}</span>
        <span class="siva">zadnji pregled ${kdaj(b.zadnji)}</span>
        ${b.napaka ? `<span class="err" style="margin:0">Napaka: ${esc(b.napaka)}</span>` : ""}
        <span style="margin-left:auto;display:flex;gap:6px"><button class="ghost" data-a="banka-preglej">Preglej zdaj</button>${!b.povezano || potekla ? `<button class="ghost" data-a="banka-povezi">Poveži banko</button>` : ""}</span>`;
    }
    function nakazilo(m) {
      if (m.stanje === "potrjen" && m.preverjeno) {
        const p = m.preverjeno;
        return `<div class="nakazilo">${p.samodejno ? "Samodejno prek banke" : "Ročno"} · ${kdaj(p.ob)}${p.placnik ? ` · plačnik <b>${esc(p.placnik)}</b>` : ""}${p.iban ? ` · ${esc(p.iban)}` : ""}</div>`;
      }
      if (m.stanje === "caka") {
        return `<div class="nakazilo">Sklic <b>${esc(m.sklic)}</b> · od ${kdaj(m.cakaOd)}<br>${m.placnik
          ? `Plačnik <b>${esc(m.placnik)}</b>${m.iban ? ` · ${esc(m.iban)}` : ""} · ime ${m.ujema ? `<span class="znacka z-potrjen">se ujema</span>` : `<span class="znacka z-zavrnjen">se ne ujema</span>`}`
          : `<span class="siva">Mojster pravi, da je nakazal; banka nakazila še ni našla.</span>`}</div>`;
      }
      if (m.stanje === "zavrnjen") return `<div class="nakazilo siva">Zavrnjeno ${kdaj(m.cakaOd)} · sklic ${esc(m.sklic)}</div>`;
      return "";
    }
    function stolpci(naDan, dni = 30) {
      const dnevi = [...Array(dni)].map((_, i) => new Date(Date.now() - (dni - 1 - i) * 864e5).toLocaleDateString("sv-SE", { timeZone: "Europe/Ljubljana" }));
      const v = dnevi.map((d) => naDan[d] || 0), max = Math.max(1, ...v);
      return `<div class="stolpci">${v.map((x, i) => `<div class="${x ? "" : "prazen"}" style="height:${Math.max(3, x / max * 100)}%" title="${dnevi[i]}: ${x}"></div>`).join("")}</div>
        <div class="os"><span>${new Date(dnevi[0]).toLocaleDateString("sl-SI")}</span><span>danes</span></div>`;
    }
    function statistika() {
      if (!stat) return `<p class="siva">Nalagam statistiko …</p>`;
      const u = stat.uporabniki, d = stat.dela, po = d.po || {};
      const t = (st, op) => `<div class="tile"><div class="st">${st}</div><div class="op">${op}</div></div>`;
      return `<h2 style="font-size:16px;margin:4px 0 8px">Od objave v App Storu (${new Date(stat.objava).toLocaleDateString("sl-SI")})</h2>
        <div class="stat">
          ${t(u.odObjave, "novih računov (namestitev)")}${t(d.strankeOdObjave, "strank, ki so oddale delo")}${t(d.odObjave, "oddanih del")}${t(stat.mojstri.odObjave, "novih mojstrov")}
        </div>
        <h2 style="font-size:16px;margin:4px 0 8px">Vse skupaj <span class="siva" style="font-weight:400">(tudi testni računi iz TestFlighta)</span></h2>
        <div class="stat">
          ${t(u.skupaj, "računov")}${t(u.aktivni1, "aktivnih danes")}${t(u.aktivni7, "aktivnih v 7 dneh")}${t(d.stranke, "strank z delom")}
          ${t(stat.mojstri.skupaj, "mojstrov")}${t(stat.mojstri.preverjeni, "potrjenih podjetij")}
          ${t(d.skupaj, "oddanih del")}${t(po.odprto || 0, "odprtih del")}${t((po.prevzeto || 0) + (po.opravljeno || 0), "prevzetih ali opravljenih")}
          ${t(stat.ponudbe, "ponudb mojstrov")}${t(stat.ocene, "ocen")}
        </div>
        <div class="stat" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
          <div class="graf"><b>Novi uporabniki</b> <span class="siva">· zadnjih 30 dni: ${u.novi30}</span>${stolpci(u.noviNaDan)}</div>
          <div class="graf"><b>Oddana dela</b> <span class="siva">· zadnjih 30 dni: ${d.novi30}</span>${stolpci(d.naDan)}</div>
        </div>`;
    }
    const zavihki = () => `<div class="zavihki"><button data-p="mojstri" class="${pogled === "mojstri" ? "izbran" : ""}">Mojstri</button><button data-p="dela" class="${pogled === "dela" ? "izbran" : ""}">Dela</button></div>`;
    function skupno() {
      el.querySelectorAll("[data-p]").forEach((b) => b.onclick = () => { pogled = b.dataset.p; izrisi(); });
      document.getElementById("odjava").onclick = () => odjava();
    }
    async function naloziDela() {
      try { dela = (await klic({ koda, akcija: "dela" })).data.dela; } catch (e) { alert(e.message); dela = []; }
      izbrana = new Set([...izbrana].filter((id) => dela.some((d) => d.id === id)));
      if (pogled === "dela") izrisi();
    }
    function izrisiDela() {
      if (!dela) { el.innerHTML = `${statistika()}${zavihki()}<p class="siva">Nalagam dela …</p><p><button class="ghost" id="odjava">Odjava</button></p>`; skupno(); naloziDela(); return; }
      const q = iskanje.toLowerCase();
      const vidna = dela.filter((d) => !q || [d.opis, d.stroka, d.kraj, d.id].join(" ").toLowerCase().includes(q));
      el.innerHTML = `${statistika()}${zavihki()}
        <div class="filtri"><button class="rdec" id="brisiVec" ${izbrana.size ? "" : "disabled"}>Izbriši označena (${izbrana.size})</button>
          <input id="isci" type="search" placeholder="Išči opis, kraj, stroko" value="${esc(iskanje)}"></div>
        <p class="siva">Brisanje velja takoj (tudi v aplikaciji). Mojster, ki je delo prevzel, dobi obvestilo, da je preklicano.</p>
        ${vidna.length ? vidna.map((d) => `<div class="d">
          <input type="checkbox" data-id="${esc(d.id)}" ${izbrana.has(d.id) ? "checked" : ""}>
          ${d.slika ? `<img src="${esc(d.slika)}" alt="" loading="lazy">` : `<img alt="">`}
          <div><div class="ime"><b>${esc(d.opis || d.stroka)}</b> <span class="znacka z-${esc(d.status)}">${esc(d.status)}</span></div>
            <div class="siva">${esc(d.stroka)} · ${esc(d.kraj)} · ${esc(d.kdaj)} · ${kdaj(d.ustvarjeno)}${d.slik ? ` · +${d.slik} slik` : ""} · obveščenih mojstrov: ${d.obvesceni}</div></div>
          <div class="desno"><button class="rdec" data-brisi="${esc(d.id)}">Izbriši</button></div>
        </div>`).join("") : `<p class="siva">Ni del.</p>`}
        <p class="siva" style="margin-top:24px"><button class="ghost" id="odjava">Odjava</button></p>`;
      skupno();
      const isci = document.getElementById("isci");
      isci.oninput = () => { iskanje = isci.value; const p = isci.selectionStart; izrisi(); const n = document.getElementById("isci"); n.focus(); n.setSelectionRange(p, p); };
      el.querySelectorAll("input[data-id]").forEach((c) => c.onchange = () => { c.checked ? izbrana.add(c.dataset.id) : izbrana.delete(c.dataset.id); izrisi(); });
      const brisi = async (ids, b) => {
        if (!confirm(ids.length === 1 ? "Izbrišem to delo? Tega ni mogoče razveljaviti." : `Izbrišem ${ids.length} del? Tega ni mogoče razveljaviti.`)) return;
        b.disabled = true;
        try { await klic({ koda, akcija: "izbrisi-delo", ids }); ids.forEach((id) => izbrana.delete(id)); } catch (e) { alert(e.message); }
        naloziDela();
        klic({ koda, akcija: "statistika" }).then((r) => { stat = r.data; izrisi(); }).catch(() => {});
      };
      el.querySelectorAll("[data-brisi]").forEach((b) => b.onclick = () => brisi([b.dataset.brisi], b));
      const bv = document.getElementById("brisiVec");
      bv.onclick = () => brisi([...izbrana], bv);
    }
    function izrisi() {
      if (pogled === "dela") return izrisiDela();
      const vsi = podatki.mojstri;
      const st = { caka: 0, potrjen: 0, ni: 0, zavrnjen: 0 };
      vsi.forEach((m) => st[m.stanje]++);
      const q = iskanje.toLowerCase();
      const vidni = vsi.filter((m) => (filter === "vsi" || (filter === "ni" ? m.stanje === "ni" || m.stanje === "zavrnjen" : m.stanje === filter))
        && (!q || [m.ime, m.firma, m.davcna, m.tel].join(" ").toLowerCase().includes(q)));
      const gumb = (k, t) => `<button data-f="${k}" class="${filter === k ? "izbran" : ""}">${t}</button>`;
      el.innerHTML = `${statistika()}${zavihki()}<div class="banka">${banka(podatki.banka)}</div>
        <div class="filtri">${gumb("caka", `Čaka (${st.caka})`)}${gumb("potrjen", `Potrjeni (${st.potrjen})`)}${gumb("ni", `Niso nakazali (${st.ni + st.zavrnjen})`)}${gumb("vsi", `Vsi (${vsi.length})`)}
          <input id="isci" type="search" placeholder="Išči ime, podjetje, davčno" value="${esc(iskanje)}"></div>
        ${vidni.length ? vidni.map((m) => `<div class="m">
          ${m.slika ? `<img src="${esc(m.slika)}" alt="" loading="lazy">` : `<img alt="">`}
          <div>
            <div class="ime">${esc(m.firma || "(brez podjetja)")} <span class="znacka z-${m.stanje}">${STANJE[m.stanje]}</span></div>
            <div>${esc(m.ime)}${m.tel ? ` · <a href="tel:${esc(m.tel)}">${esc(m.tel)}</a>` : ""}</div>
            <div class="podatki">
              <span>Davčna: ${m.davcna ? `<b>${esc(m.davcna)}</b> · <a href="https://www.ajpes.si/prs/rezultati.asp?davcna=${encodeURIComponent(m.davcna)}" target="_blank" rel="noopener">AJPES</a> · <a href="https://www.bizi.si/iskanje/?q=${encodeURIComponent(m.davcna)}" target="_blank" rel="noopener">Bizi</a>` : "–"}</span>
              <span>Registriran: ${dan(m.ustvarjen)}</span>
              <span>Stroke: ${esc(m.stroke.join(", ") || "–")}</span>
              <span>Regije: ${esc(m.regije.join(", ") || "–")}</span>
              <span>Naročnina: ${narocnina(m)}</span>
            </div>
            ${nakazilo(m)}
          </div>
          <div class="desno">${m.stanje !== "potrjen" ? `<button data-a="potrdi" data-uid="${esc(m.uid)}" data-ime="${esc(m.firma)}">Potrdi</button>` : ""}${m.stanje === "caka" ? `<button class="rdec" data-a="zavrni" data-uid="${esc(m.uid)}" data-ime="${esc(m.firma)}">Zavrni</button>` : ""}<button class="ghost" data-a="izbrisi-mojstra" data-uid="${esc(m.uid)}" data-ime="${esc(m.firma || m.ime)}">Izbriši</button></div>
        </div>`).join("") : `<p class="siva">Ni mojstrov v tem pogledu.</p>`}
        <p class="siva" style="margin-top:24px"><button class="ghost" id="odjava">Odjava</button></p>`;
      el.querySelectorAll("[data-f]").forEach((b) => b.onclick = () => { filter = b.dataset.f; try { localStorage.setItem("pregled-filter", filter); } catch (e) {} izrisi(); });
      const isci = document.getElementById("isci");
      isci.oninput = () => { iskanje = isci.value; const p = isci.selectionStart; izrisi(); const n = document.getElementById("isci"); n.focus(); n.setSelectionRange(p, p); };
      skupno();
      el.querySelectorAll("[data-a]").forEach((b) => b.onclick = async () => {
        const a = b.dataset.a;
        if (a === "potrdi" && !confirm(`Potrdim podjetje »${b.dataset.ime}«? Mojster dobi obvestilo in se lahko javlja na dela.`)) return;
        if (a === "izbrisi-mojstra" && !confirm(`Izbrišem mojstra »${b.dataset.ime}«? Izgine profil, ponudbe in ocene; dela, ki jih je imel prevzeta, se znova odprejo. Tega ni mogoče razveljaviti.`)) return;
        if (a === "zavrni" && !confirm(`Zavrnem nakazilo za »${b.dataset.ime}«? Mojster dobi obvestilo, da nakazila nismo našli.`)) return;
        b.disabled = true;
        try {
          const r = (await klic({ koda, akcija: a, uid: b.dataset.uid })).data;
          if (a === "banka-povezi" && r.url) { location.href = r.url; return; }
        } catch (e) { alert(e.message); }
        if (a === "izbrisi-mojstra") { dela = null; klic({ koda, akcija: "statistika" }).then((r) => { stat = r.data; izrisi(); }).catch(() => {}); }
        nalozi();
      });
    }
    (async () => {
      if (auth.isSignInWithEmailLink(location.href)) {
        let mail = ""; try { mail = localStorage.getItem("pregled-mail") || ""; } catch (e) {}
        if (!mail) mail = prompt("Potrdi svoj e-naslov") || "";
        try { await auth.signInWithEmailLink(mail.trim(), location.href); } catch (e) { history.replaceState(null, "", "/"); return prijava(e.message); }
        history.replaceState(null, "", "/");
      }
      const u = await new Promise((ok) => { const s = auth.onAuthStateChanged((x) => { s(); ok(x); }); });
      if (u && u.email) return nalozi();
      if (koda) { if (!u) await auth.signInAnonymously(); return nalozi(); }
      prijava();
    })().catch((e) => { el.innerHTML = `<div class="err">${esc(e.message)}</div>`; });
  </script>
</body>
