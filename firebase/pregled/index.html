<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Popravko pregled</title>
  <style>
    :root{--bg:#F4F6F5;--kartica:#fff;--tekst:#16201D;--siva:#5E6B66;--rob:rgba(0,0,0,.1);--zelena:#1F8A5B;--zelena-bg:#E3F4EB;--rumena:#9A6700;--rumena-bg:#FFF4D6;--rdeca:#B42318;--rdeca-bg:#FDE7E5;--modra:#1D5FD1}
    @media (prefers-color-scheme:dark){:root{--bg:#121816;--kartica:#1B2321;--tekst:#E7EDEA;--siva:#9AA8A2;--rob:rgba(255,255,255,.12);--zelena:#4CC38A;--zelena-bg:#173528;--rumena:#E6B54A;--rumena-bg:#3A3018;--rdeca:#F97066;--rdeca-bg:#3D1C1A;--modra:#7AA7FF}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--tekst);font:15px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif}
    .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
    h1{font-size:24px;margin:0 0 14px}
    a{color:var(--modra)}
    small,.siva{color:var(--siva)}
    input{width:100%;max-width:340px;padding:12px;font-size:16px;border-radius:10px;border:1px solid var(--rob);background:var(--kartica);color:var(--tekst);margin-bottom:10px}
    button{font:inherit;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--zelena);color:#fff;font-weight:600}
    button.ghost{background:transparent;color:var(--tekst);border:1px solid var(--rob)}
    button.rdec{background:var(--rdeca)}
    button:disabled{opacity:.5;cursor:default}
    .banka{background:var(--kartica);border:1px solid var(--rob);border-radius:14px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center}
    .filtri{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
    .filtri button{background:transparent;color:var(--tekst);border:1px solid var(--rob);font-weight:500}
    .filtri button.izbran{background:var(--tekst);color:var(--bg)}
    .filtri input{margin:0 0 0 auto;max-width:240px;padding:8px 10px;font-size:14px}
    .m{background:var(--kartica);border:1px solid var(--rob);border-radius:14px;padding:14px;margin:10px 0;display:grid;grid-template-columns:56px 1fr auto;gap:12px}
    .m img{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--rob)}
    .m .ime{font-weight:700;font-size:16px}
    .podatki{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:2px 16px;margin-top:6px}
    .znacka{display:inline-block;padding:3px 9px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
    .z-potrjen{background:var(--zelena-bg);color:var(--zelena)}
    .z-caka{background:var(--rumena-bg);color:var(--rumena)}
    .z-zavrnjen{background:var(--rdeca-bg);color:var(--rdeca)}
    .z-ni{background:var(--rob);color:var(--siva)}
    .nakazilo{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--bg)}
    .desno{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
    .err{color:var(--rdeca);margin:8px 0}
    @media (max-width:640px){.m{grid-template-columns:44px 1fr}.m img{width:44px;height:44px}.desno{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;align-items:center}.filtri input{margin:6px 0 0;max-width:none}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Popravko · mojstri</h1>
    <div id="vsebina"><p class="siva">Nalagam …</p></div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
  <script>
    // Vsi mojstri in potrditev podjetja (nakazilo 0,01 €). Dostop s kodo skrbnika (ista kot v aplikaciji in na moderaciji).
    firebase.initializeApp({ apiKey: "AIzaSyCi-g2V67UMyELMjG7fl0BxcqCuUaWRkx4", authDomain: "fixko-app.firebaseapp.com", projectId: "fixko-app", appId: "1:117276939392:web:9728005ec9450ac8c50265" });
    const klic = firebase.app().functions("europe-west1").httpsCallable("skrbnik");
    const el = document.getElementById("vsebina");
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const kdaj = (ms) => ms ? new Date(ms).toLocaleString("sl-SI", { dateStyle: "short", timeStyle: "short" }) : "–";
    const dan = (ms) => ms ? new Date(ms).toLocaleDateString("sl-SI") : "–";
    const STANJE = { potrjen: "Potrjen", caka: "Čaka na potrditev", zavrnjen: "Zavrnjen", ni: "Ni nakazal" };
    let koda = "", podatki = null, filter = "caka", iskanje = "";
    try { koda = localStorage.getItem("skrbnik") || ""; filter = localStorage.getItem("pregled-filter") || "caka"; } catch (e) {}

    function prijava(napaka) {
      el.innerHTML = `<input id="koda" type="password" placeholder="Koda skrbnika" autocomplete="off">${napaka ? `<div class="err">${esc(napaka)}</div>` : ""}<div><button id="ok">Naprej</button></div>`;
      const i = document.getElementById("koda");
      const naprej = () => { koda = i.value.trim(); try { localStorage.setItem("skrbnik", koda); } catch (e) {} nalozi(); };
      document.getElementById("ok").onclick = naprej;
      i.onkeydown = (e) => { if (e.key === "Enter") naprej(); };
      i.focus();
    }
    async function nalozi() {
      if (!koda) return prijava();
      try { podatki = (await klic({ koda, akcija: "vsi" })).data; }
      catch (e) {
        if (e.code === "functions/permission-denied" || /koda/i.test(e.message)) { koda = ""; try { localStorage.removeItem("skrbnik"); } catch (x) {} return prijava(e.message); }
        el.innerHTML = `<div class="err">${esc(e.message)}</div>`; return;
      }
      izrisi();
    }
    function narocnina(m) {
      if (m.testni) return "testni račun";
      if (m.narocninaDo > Date.now()) return (m.transakcija ? "plačana" : m.preizkus ? "preizkus" : "brezplačna") + " do " + dan(m.narocninaDo);
      return m.narocninaDo ? "potekla " + dan(m.narocninaDo) : "ni aktivirana";
    }
    function banka(b) {
      if (!b.nastavljeno) return `<b>Banka:</b> <span class="znacka z-ni">ni nastavljena</span>`;
      const potekla = b.veljaDo && b.veljaDo < Date.now();
      return `<b>Banka (Enable Banking):</b>
        <span class="znacka ${b.povezano && !potekla ? "z-potrjen" : "z-zavrnjen"}">${b.povezano ? (potekla ? "povezava potekla" : "povezana") : "ni povezana"}</span>
        ${b.iban ? `<span>${esc(b.iban)}</span>` : ""}
        <span class="siva">velja do ${dan(b.veljaDo)}</span>
        <span class="siva">zadnji pregled ${kdaj(b.zadnji)}</span>
        ${b.napaka ? `<span class="err" style="margin:0">Napaka: ${esc(b.napaka)}</span>` : ""}
        <span style="margin-left:auto;display:flex;gap:6px"><button class="ghost" data-a="banka-preglej">Preglej zdaj</button>${!b.povezano || potekla ? `<button class="ghost" data-a="banka-povezi">Poveži banko</button>` : ""}</span>`;
    }
    function nakazilo(m) {
      if (m.stanje === "potrjen" && m.preverjeno) {
        const p = m.preverjeno;
        return `<div class="nakazilo">${p.samodejno ? "Samodejno prek banke" : "Ročno"} · ${kdaj(p.ob)}${p.placnik ? ` · plačnik <b>${esc(p.placnik)}</b>` : ""}${p.iban ? ` · ${esc(p.iban)}` : ""}</div>`;
      }
      if (m.stanje === "caka") {
        return `<div class="nakazilo">Sklic <b>${esc(m.sklic)}</b> · od ${kdaj(m.cakaOd)}<br>${m.placnik
          ? `Plačnik <b>${esc(m.placnik)}</b>${m.iban ? ` · ${esc(m.iban)}` : ""} · ime ${m.ujema ? `<span class="znacka z-potrjen">se ujema</span>` : `<span class="znacka z-zavrnjen">se ne ujema</span>`}`
          : `<span class="siva">Mojster pravi, da je nakazal; banka nakazila še ni našla.</span>`}</div>`;
      }
      if (m.stanje === "zavrnjen") return `<div class="nakazilo siva">Zavrnjeno ${kdaj(m.cakaOd)} · sklic ${esc(m.sklic)}</div>`;
      return "";
    }
    function izrisi() {
      const vsi = podatki.mojstri;
      const st = { caka: 0, potrjen: 0, ni: 0, zavrnjen: 0 };
      vsi.forEach((m) => st[m.stanje]++);
      const q = iskanje.toLowerCase();
      const vidni = vsi.filter((m) => (filter === "vsi" || (filter === "ni" ? m.stanje === "ni" || m.stanje === "zavrnjen" : m.stanje === filter))
        && (!q || [m.ime, m.firma, m.davcna, m.tel].join(" ").toLowerCase().includes(q)));
      const gumb = (k, t) => `<button data-f="${k}" class="${filter === k ? "izbran" : ""}">${t}</button>`;
      el.innerHTML = `<div class="banka">${banka(podatki.banka)}</div>
        <div class="filtri">${gumb("caka", `Čaka (${st.caka})`)}${gumb("potrjen", `Potrjeni (${st.potrjen})`)}${gumb("ni", `Niso nakazali (${st.ni + st.zavrnjen})`)}${gumb("vsi", `Vsi (${vsi.length})`)}
          <input id="isci" type="search" placeholder="Išči ime, podjetje, davčno" value="${esc(iskanje)}"></div>
        ${vidni.length ? vidni.map((m) => `<div class="m">
          ${m.slika ? `<img src="${esc(m.slika)}" alt="" loading="lazy">` : `<img alt="">`}
          <div>
            <div class="ime">${esc(m.firma || "(brez podjetja)")} <span class="znacka z-${m.stanje}">${STANJE[m.stanje]}</span></div>
            <div>${esc(m.ime)}${m.tel ? ` · <a href="tel:${esc(m.tel)}">${esc(m.tel)}</a>` : ""}</div>
            <div class="podatki">
              <span>Davčna: ${m.davcna ? `<b>${esc(m.davcna)}</b> · <a href="https://www.ajpes.si/prs/rezultati.asp?davcna=${encodeURIComponent(m.davcna)}" target="_blank" rel="noopener">AJPES</a> · <a href="https://www.bizi.si/iskanje/?q=${encodeURIComponent(m.davcna)}" target="_blank" rel="noopener">Bizi</a>` : "–"}</span>
              <span>Registriran: ${dan(m.ustvarjen)}</span>
              <span>Stroke: ${esc(m.stroke.join(", ") || "–")}</span>
              <span>Regije: ${esc(m.regije.join(", ") || "–")}</span>
              <span>Naročnina: ${narocnina(m)}</span>
            </div>
            ${nakazilo(m)}
          </div>
          <div class="desno">${m.stanje !== "potrjen" ? `<button data-a="potrdi" data-uid="${esc(m.uid)}" data-ime="${esc(m.firma)}">Potrdi</button>` : ""}${m.stanje === "caka" ? `<button class="rdec" data-a="zavrni" data-uid="${esc(m.uid)}" data-ime="${esc(m.firma)}">Zavrni</button>` : ""}</div>
        </div>`).join("") : `<p class="siva">Ni mojstrov v tem pogledu.</p>`}
        <p class="siva" style="margin-top:24px"><button class="ghost" id="odjava">Odjava</button></p>`;
      el.querySelectorAll("[data-f]").forEach((b) => b.onclick = () => { filter = b.dataset.f; try { localStorage.setItem("pregled-filter", filter); } catch (e) {} izrisi(); });
      const isci = document.getElementById("isci");
      isci.oninput = () => { iskanje = isci.value; const p = isci.selectionStart; izrisi(); const n = document.getElementById("isci"); n.focus(); n.setSelectionRange(p, p); };
      document.getElementById("odjava").onclick = () => { koda = ""; try { localStorage.removeItem("skrbnik"); } catch (e) {} prijava(); };
      el.querySelectorAll("[data-a]").forEach((b) => b.onclick = async () => {
        const a = b.dataset.a;
        if (a === "potrdi" && !confirm(`Potrdim podjetje »${b.dataset.ime}«? Mojster dobi obvestilo in se lahko javlja na dela.`)) return;
        if (a === "zavrni" && !confirm(`Zavrnem nakazilo za »${b.dataset.ime}«? Mojster dobi obvestilo, da nakazila nismo našli.`)) return;
        b.disabled = true;
        try {
          const r = (await klic({ koda, akcija: a, uid: b.dataset.uid })).data;
          if (a === "banka-povezi" && r.url) { location.href = r.url; return; }
        } catch (e) { alert(e.message); }
        nalozi();
      });
    }
    firebase.auth().signInAnonymously().then(nalozi).catch((e) => { el.innerHTML = `<div class="err">${esc(e.message)}</div>`; });
  </script>
</body>
</html>
