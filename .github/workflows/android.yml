name: Android aplikacija

# Zgradi podpisan Fixko.apk (test) in Popravko.aab ter Fixko-play.aab za Google Play in ju objavi v izdaji "android":
# https://github.com/myedgeofficial/fixko/releases/download/android/Fixko.apk
# PR: samo preveri, da se zgradi.
on:
  pull_request:
  push:
    branches: [main]
    paths: ["web/**", "app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.event_name == 'pull_request' && github.ref || 'izdaja' }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        izdaja: [popravko, fixko]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT || 'fixko-app' }}
      FIXKO_VERSION_CODE: ${{ github.run_number }}
      FIXKO_IZDAJA: ${{ matrix.izdaja }}
      FIXKO_APP_ID: ${{ matrix.izdaja == 'fixko' && 'com.remako.fixko' || 'si.fixko.app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Preizkusi pomožne funkcije (termini, telefon)
        if: matrix.izdaja == 'popravko'
        working-directory: web
        run: node --test tests/*.test.js

      - name: Nastavitve strežnika (Firebase)
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "Uporabim app/fb-config.json."; exit 0; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          CFG=$(npx --yes firebase-tools@14 --project "$FIREBASE_PROJECT" --non-interactive apps:sdkconfig WEB --json | python3 scripts/fb-config.py)
          echo "FIXKO_FB_CONFIG=$CFG" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/sa.json"

      - name: "Fixko: obvestila (google-services.json za com.remako.fixko)"
        if: matrix.izdaja == 'fixko'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # Brez nastavitev za Fixko paket se ne zgradi (google-services), zato jih poiščemo ali ustvarimo; če ne gre, Fixko na Androidu nima obvestil.
          : > android/app/google-services.json
          if [ -z "$SA" ]; then echo "::warning::Ni FIREBASE_SERVICE_ACCOUNT, Fixko brez obvestil."; exit 0; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          FB="npx --yes firebase-tools@14 --project $FIREBASE_PROJECT --non-interactive"
          ID=$($FB apps:list ANDROID --json | python3 -c "import json,sys; print(next((a['appId'] for a in json.load(sys.stdin)['result'] if a.get('packageName')=='com.remako.fixko'),''))") || ID=""
          [ -n "$ID" ] || ID=$($FB apps:create ANDROID Fixko --package-name com.remako.fixko --json | python3 -c "import json,sys; print(json.load(sys.stdin)['result']['appId'])") || ID=""
          if [ -n "$ID" ]; then rm -f android/app/google-services.json; $FB apps:sdkconfig ANDROID "$ID" --out android/app/google-services.json || : > android/app/google-services.json; fi
          rm -f "$RUNNER_TEMP/sa.json"
          [ -s android/app/google-services.json ] && echo "Fixko: obvestila vklopljena" || echo "::warning::Fixko brez obvestil (google-services.json)."

      - name: Ključ za podpis
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then echo "Podpis s testnim ključem (app/android/fixko-test.keystore)."; exit 0; fi
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/fixko.keystore"
          echo "FIXKO_KEYSTORE=$RUNNER_TEMP/fixko.keystore" >> "$GITHUB_ENV"
          echo "FIXKO_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"

      - name: Pripravi spletni del in Capacitor
        run: |
          npm ci
          node scripts/build-www.js
          npx cap sync android

      - name: Zgradi APK
        if: matrix.izdaja == 'popravko'
        working-directory: app/android
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Fixko.apk"
          ls -la "$RUNNER_TEMP/Fixko.apk"
          # Paket za Google Play (AAB); pred oddajo ga podpišemo z naloži-ključem.
          ./gradlew --no-daemon bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/Popravko.aab"

      - name: Zgradi Fixko za Google Play (AAB)
        if: matrix.izdaja == 'fixko'
        working-directory: app/android
        run: |
          ./gradlew --no-daemon bundleRelease
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/Fixko-play.aab"

      - name: Objavi Fixko-play.aab
        if: matrix.izdaja == 'fixko' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload android "$RUNNER_TEMP/Fixko-play.aab" --clobber

      - uses: actions/upload-artifact@v4
        if: matrix.izdaja == 'popravko'
        with:
          name: Fixko-apk
          path: ${{ runner.temp }}/Fixko.apk

      - name: Objavi povezavo za prenos
        if: matrix.izdaja == 'popravko' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Izdajo samo posodobimo (ne brišemo), da povezava za prenos nikoli ne izgine.
          NOTES="Testna verzija 1.0.$FIXKO_VERSION_CODE. Prenesi Fixko.apk na telefonu in ga odpri (dovoli namestitev iz brskalnika)."
          if gh release view android >/dev/null 2>&1; then
            gh release upload android "$RUNNER_TEMP/Fixko.apk" "$RUNNER_TEMP/Popravko.aab" --clobber
            gh release edit android --draft=false --prerelease --title "Popravko za Android (test)" --notes "$NOTES"
          else
            gh release create android "$RUNNER_TEMP/Fixko.apk" "$RUNNER_TEMP/Popravko.aab" --prerelease --target "$GITHUB_SHA" --title "Popravko za Android (test)" --notes "$NOTES"
          fi
          curl -sfI -L "https://github.com/${GITHUB_REPOSITORY}/releases/download/android/Fixko.apk" -o /dev/null || { echo "::error::Povezava za prenos ne deluje"; exit 1; }
          echo "::notice::https://github.com/${GITHUB_REPOSITORY}/releases/download/android/Fixko.apk"
