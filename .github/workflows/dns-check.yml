name: dns-check
on:
  push:
    branches: [claude/project-thread-yy4yor]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          sudo apt-get install -y -qq dnsutils >/dev/null 2>&1
          for s in $(dig +short si NS | head -2); do echo "delegation @$s: $(dig +norec remako.si NS @$s | grep -A3 AUTHORITY | grep NS | awk '{print $5}' | tr '\n' ' ')"; done
          for r in 1.1.1.1 8.8.8.8; do for t in A MX TXT; do echo "$r $t: $(dig +short remako.si $t @$r | tr '\n' ' ') [$(dig remako.si $t @$r | grep -o 'status: [A-Z]*')]"; done; done
          for t in MX TXT; do echo "ns1.freedns $t: $(dig +norec +short remako.si $t @ns1.freedns.si | tr '\n' ' ')"; done
          echo "_dmarc: $(dig +short _dmarc.remako.si TXT @1.1.1.1)"
          for u in https://remako.si https://www.remako.si http://remako.si; do echo "$u: $(curl -sS -m 15 -o /dev/null -w '%{http_code} -> %{redirect_url} ssl=%{ssl_verify_result}' $u 2>&1)"; done
          echo | timeout 15 openssl s_client -connect remako.si:443 -servername remako.si 2>/dev/null | openssl x509 -noout -subject -issuer -enddate
          echo "pages: $(curl -sS -H 'Authorization: Bearer ${{ github.token }}' https://api.github.com/repos/repusicurska-dot/remako-si/pages | tr -d '\n ' | head -c 500)"
