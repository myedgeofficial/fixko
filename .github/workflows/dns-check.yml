name: dns-check
on:
  push:
    branches: [claude/project-thread-yy4yor]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          sudo apt-get install -y -qq dnsutils >/dev/null 2>&1
          for n in remako.si www.remako.si; do for t in A AAAA CNAME CAA; do echo "$n $t: $(dig +short $n $t @1.1.1.1 | tr '\n' ' ')"; done; done
          for h in remako.si www.remako.si; do echo "== cert $h"; echo | timeout 15 openssl s_client -connect $h:443 -servername $h 2>/dev/null | openssl x509 -noout -subject -issuer -enddate -ext subjectAltName; done
          for u in https://remako.si https://www.remako.si http://remako.si http://www.remako.si; do echo "$u: $(curl -sS -m 15 -o /dev/null -w '%{http_code} -> %{redirect_url}' $u 2>&1 | tail -1)"; done
          echo "== pages"; curl -sS -H 'Authorization: Bearer ${{ github.token }}' https://api.github.com/repos/repusicurska-dot/remako-si/pages
          echo "== safebrowsing transparency"; curl -sS -m 15 "https://transparencyreport.google.com/transparencyreport/api/v3/safebrowsing/status?site=remako.si" | head -c 300; echo
