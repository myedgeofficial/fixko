name: dns-check
on:
  push:
    branches: [claude/project-thread-yy4yor]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          sudo apt-get install -y -qq dnsutils >/dev/null 2>&1
          echo "== delegation per .si server"
          for s in $(dig +short si NS); do echo "-- $s: $(dig +norec +short remako.si NS @$s | tr '\n' ' ') $(dig +norec remako.si NS @$s | grep -A3 AUTHORITY | grep NS | awk '{print $5}' | tr '\n' ' ')"; done
          for ns in ns1.freedns.si ns2.freedns.si ns3.freedns.si cdns1.controlpanel.si cdns2.controlpanel.si; do
            echo "== $ns"; for q in "remako.si SOA" "remako.si NS" "remako.si A" "www.remako.si A" "www.remako.si CNAME"; do echo "  $q: $(dig +norec +short $q @$ns 2>&1 | tr '\n' ' ') [$(dig +norec $q @$ns | grep -o 'status: [A-Z]*')]"; done
          done
          echo "== public"; for r in 1.1.1.1 8.8.8.8 9.9.9.9; do echo "$r: A=$(dig +short remako.si A @$r|tr '\n' ' ') status=$(dig remako.si A @$r | grep -o 'status: [A-Z]*')"; done
          echo "== pages api"; curl -sS -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/repusicurska-dot/remako-si/pages | head -30
