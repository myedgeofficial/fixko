name: dns-check
on:
  push:
    branches: [claude/project-thread-yy4yor]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq dnsutils whois >/dev/null 2>&1 || true
          for t in NS SOA A AAAA CNAME CAA; do echo "== remako.si $t"; dig +short remako.si $t @1.1.1.1; done
          for t in A CNAME; do echo "== www $t"; dig +short www.remako.si $t @1.1.1.1; done
          echo "== NS from .si"; dig +norec remako.si NS @$(dig +short si NS | head -1) | sed -n '/AUTHORITY/,/^$/p'
          echo "== whois"; whois remako.si 2>&1 | grep -v '^%' | sed '/^$/d' | head -40
          for u in http://remako.si https://remako.si https://www.remako.si https://repusicurska-dot.github.io/remako-si/; do echo "== $u"; curl -sS -m 15 -o /dev/null -w "%{http_code} -> %{redirect_url} ssl=%{ssl_verify_result}\n" $u 2>&1; done
          echo "== cert"; echo | timeout 15 openssl s_client -connect remako.si:443 -servername remako.si 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>&1
          echo "== pages api"; curl -sS -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/repusicurska-dot/remako-si/pages
          echo; echo "== pages health"; curl -sS -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/repusicurska-dot/remako-si/pages/health
