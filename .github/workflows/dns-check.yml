name: dns-check
on:
  push:
    branches: [claude/project-thread-yy4yor]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          for q in "bundleId=com.byurska.lumora" "bundleId=si.fixko.app" "bundleId=si.nakupko.app" "id=6818745132" "id=6821712043"; do echo "== $q"; curl -sS "https://itunes.apple.com/lookup?$q&country=si" | python3 -c 'import sys,json;d=json.load(sys.stdin);[print(r.get("trackName"),r.get("trackViewUrl"),r.get("bundleId"),r.get("price")) for r in d["results"]] or print("none")'; done
          echo "== search"; curl -sS "https://itunes.apple.com/search?term=manifest+by+urska&country=si&entity=software" | python3 -c 'import sys,json;d=json.load(sys.stdin);[print(r.get("trackName"),r.get("trackViewUrl"),r.get("bundleId")) for r in d["results"][:5]]'
          for p in si.nakupko.app si.fixko.app com.byurska.lumora; do echo "play $p: $(curl -sS -o /dev/null -w '%{http_code}' "https://play.google.com/store/apps/details?id=$p&hl=sl")"; done
